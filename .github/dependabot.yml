version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns:
          - "*"
    # This pin defines the current stable Home Assistant contract lane and is
    # advanced deliberately after checking that it does not target an HA beta.
    ignore:
      - dependency-name: pytest-homeassistant-custom-component

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns:
          - "*"
