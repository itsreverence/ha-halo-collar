version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns:
          - "*"
    # This pin defines the current stable Home Assistant contract lane. Its
    # version is the Home Assistant version it installs, so it advances
    # deliberately to a stable release with the compatibility docs.
    ignore:
      - dependency-name: pytest-homeassistant

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns:
          - "*"
